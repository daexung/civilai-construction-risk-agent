name: Check spec cards
on:
  pull_request:
    paths:
      - 'data/drafts/**'
      - 'backend/agent/rules/specs/**'
      - 'evals/check_spec_lint.py'
      - 'evals/check_spec_source_match.py'
      - 'evals/spec_lint_known.json'
      - 'data/defaults/**'
      - '.github/workflows/check-specs.yml'
  push:
    branches: [main]
    paths:
      - 'data/drafts/**'
      - 'backend/agent/rules/specs/**'
      - 'evals/check_spec_lint.py'
      - 'evals/check_spec_source_match.py'
      - 'evals/spec_lint_known.json'
      - 'data/defaults/**'
      - '.github/workflows/check-specs.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check spec cards
        run: python3 -B evals/check_spec_lint.py
