name: Deploy backend
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'data/rates/**'
      - 'data/drafts/**'
      - 'pipeline/requirements-rag.txt'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: poomsemi-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.repository == 'daexung/civilai-construction-risk-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: asia-northeast3-docker.pkg.dev/civil-ai-jds/poomsemi/api:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authenticate for serving assets
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: civil-ai-jds
          workload_identity_provider: projects/691785957289/locations/global/workloadIdentityPools/poomsemi-github/providers/github
          service_account: poomsemi-github-deploy@civil-ai-jds.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Fetch and verify serving assets
        run: python3 deploy/serving_assets.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
      - name: Refresh authentication after build
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: civil-ai-jds
          workload_identity_provider: projects/691785957289/locations/global/workloadIdentityPools/poomsemi-github/providers/github
          service_account: poomsemi-github-deploy@civil-ai-jds.iam.gserviceaccount.com
      - name: Push image
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          docker push "$IMAGE"
      - name: Update existing Cloud Run service
        run: |
          gcloud run services update poomsemi-api \
            --image="$IMAGE" \
            --update-env-vars=CLIENT_IP_SOURCE=vercel \
            --region=asia-northeast3 --project=civil-ai-jds --quiet
      - name: Verify readiness through authenticated Vercel proxy
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 10 --max-time 40 \
            https://civilai-construction-risk-agent.vercel.app/api/ready
